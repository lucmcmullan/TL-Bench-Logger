<!DOCTYPE html>
<html>
    <head>
        <title>Backups - TL Bench Logger</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <h1>Backups</h1>
        <button onclick="window.location.href='/dev'" class="btn-secondary">Back to DevTools</button>
        <br><br>
        <form action="/dev/create-backup" method="POST">
            <button type="submit">Create Backup</button>
        </form>

        <br>

        <textarea readonly class="audit-log">
        {%- for backup in backups %}
        {{ backup.name }}
        {%- endfor %}
        </textarea>
        
        <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    </body>
</html>
