<!DOCTYPE html>
<html>
    <head>
        <title>Route Test - TL Bench Logger</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <h1>Route Health Check</h1>
        <button onclick="window.location.href='/dev'" class="btn-secondary">Back to DevTools</button>
        <br><br>
        <textarea readonly class="audit-log">
        {%- for result in results %}
        {{ result.route }} -> {{ result.status }}
        {%- endfor %}
        </textarea>

        <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    </body>
</html>
