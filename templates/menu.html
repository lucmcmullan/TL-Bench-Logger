<!DOCTYPE html>
<html>
    <head>
        <title>TL Bench Logger</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <h2>TL Bench Logger</h2>

        {% if completed_session %}
            <h3>Today's session has already been completed.</h3>
            <button disabled>Session Complete</button>
        {% elif active_session %}
            <h3>A session is currently in progress.</h3>
            <form action="/join-or-start-session" method="POST">
                <button type="submit">Join Session</button>
            </form>
        {% else %}
            <h3>No session has been started today.</h3>
            <form action="/join-or-start-session" method="POST">
                <button type="submit">Start Session</button>
            </form>
        {% endif %}

        <br><br>
        <button onclick="window.location.href='/history'">Session History</button>
        <br><br>

        {% if session.get("is_admin") %}

            <button onclick="window.location.href='/admin/users'">User Management</button>
            <br><br>

        {% endif %}
        
        <button id="darkModeToggle" class="btn-secondary">Toggle Dark Mode</button>
        <br><br><br><br><br><br>
        <button onclick="window.location.href='/about'">About</button>
        <br><br>
        <button id="logoutButton">Logout</button>
        
        <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
        <script>
            document.getElementById("logoutButton")?.addEventListener("click", async () => {
                await fetch("/logout", { method: "POST" });
                    window.location.href = "/";
                });
        </script>

    </body>
</html>
