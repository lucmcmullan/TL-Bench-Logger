<!DOCTYPE html>
<html>
    <head>
        <title>User Management - TL Bench Logger</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    
    <body>
        <h1>User Management</h1>
        <button onclick="window.location.href='/menu'" class="btn-secondary">Back to Menu</button>
        <h2>Create User</h2>

        <form action="/admin/users/create" method="POST">
            <input name="initials" placeholder="Initials" autocomplete="off" required>
            <br>
            <input name="name" placeholder="Name" required>
            <br>
            <input type="password" name="password" placeholder="Password" autocomplete="new-password" required>
            <br>
            <button type="submit" class="btn-success">Create User</button>
        </form>

        <hr>

        <div class="table-container">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Initials</th>
                        <th>Name</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.initials }}</td>
                        <td>{{ user.name }}</td>
                        <td>
                            {% if user.is_admin %}
                                Yes
                            {% else %}
                                No
                            {% endif %}
                        </td>
                        <td>
                            <div class="table-actions">
                                <form action="/admin/users/reset-password/{{ user.id }}" method="POST">
                                    <input class="newPassword" type="password" name="password" placeholder="New Password">
                                    <button type="submit" class="btn-primary">Reset Password</button>

                                </form>

                                <button class="btn-secondary" onclick="window.location.href='/admin/users/toggle-admin/{{ user.id }}'">
                                    {% if user.is_admin %}
                                        Remove Admin
                                    {% else %}
                                        Make Admin
                                    {% endif %}
                                </button>
                            </div>
                        </td>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    </body>
</html>
