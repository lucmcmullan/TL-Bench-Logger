<!DOCTYPE html>
<html>
    <head>
        <title>Inspection History</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <h1>Inspection History</h1>
        <button onclick="window.location.href='/menu'" class="btn-secondary">Back to Menu</button>
        <h2>Session History</h2>
        
        <div class="table-container">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Started By</th>
                        <th>View</th>
                    </tr>
                </thead>

                <tbody>
                    {% for session in sessions %}
                    <tr>
                        <td>{{ session.date }}</td>
                        <td>{{ session.status }}</td>
                        <td>{{ session.initials }}</td>
                        <td><a class="table-link" href="/history/{{ session.id }}">Open</a></td>
                    </tr>

                    {% endfor %}
                </tbody>
            </table>
            <br>
        </div>
        <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    </body>
</html>
